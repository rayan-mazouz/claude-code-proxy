packages: []

# Native packages allowed to run their install/build scripts.
# `allowBuilds` is read by pnpm >=10 (the Docker build pins pnpm 12);
# `onlyBuiltDependencies` by older releases. Keep both in sync.
allowBuilds:
    "@tailwindcss/oxide": true
    sharp: true
    unrs-resolver: true

onlyBuiltDependencies:
    - "@tailwindcss/oxide"
    - sharp
    - unrs-resolver
