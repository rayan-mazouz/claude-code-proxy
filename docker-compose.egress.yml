name: claude-code-proxy-egress

# One host-network relay owns all configured listener ports. It is deliberately
# deployed as a separate Compose project so blue/green application slots never
# compete for host ports or interrupt active outbound streams.
services:
  relay:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    build: ./backend
    image: claude-code-proxy/backend:latest
    command: uv run python -m app.scripts.egress_relay
    network_mode: host
    restart: unless-stopped
    env_file: ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
